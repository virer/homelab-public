global
    log         127.0.0.1 local2

    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     24000
    user        haproxy
    group       haproxy
    daemon

    # turn on stats unix socket
    stats socket /var/run/haproxy.sock

    # utilize system-wide crypto-policies
    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-server-ciphers PROFILE=SYSTEM

defaults
    mode                    tcp
    log                     global
    option                  dontlognull
    retries                 3
    timeout http-request    5m
    timeout queue           1m
    timeout connect         1s
    timeout client          5m
    timeout server          5m
    timeout http-keep-alive 5m
    timeout check           10s
    maxconn                 23000

listen stats
    bind 192.168.0.11:9000
    mode http
    stats enable
    stats hide-version
    stats realm Haproxy\ Statistics
    stats uri /haproxy_stats
    stats auth admin:admin

########################################################################################################
frontend openshift-api-lab
    bind 192.168.0.11:6443
    default_backend openshift-api-lab
    mode tcp
    option tcplog

backend openshift-api-lab
    balance source
    mode tcp
    server bootstrap0 192.168.0.19:6443 verify none check check-ssl inter 10s fall 2 rise 3 backup
    server etcd-1 192.168.0.21:6443 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
    server etcd-2 192.168.0.22:6443 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
    server etcd-3 192.168.0.23:6443 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
#
frontend machine-config-server-lab
    bind 192.168.0.11:22623
    default_backend machine-config-server-lab
    mode tcp
    option tcplog

backend machine-config-server-lab
    balance source
    mode tcp
    server bootstrap0 192.168.0.19:22623 check inter 1s backup
    server etcd-1 192.168.0.21:22623 check inter 1s
    server etcd-2 192.168.0.22:22623 check inter 1s
    server etcd-3 192.168.0.23:22623 check inter 1s

#

frontend ingress-http-lab
    bind 192.168.0.11:80
    default_backend ingress-http-lab
    mode http
    # option tcplog

backend ingress-http-lab
    balance source
    mode http
    option forwardfor
    option httpchk GET /healthz
    server etcd-1 192.168.0.21:80 check port 1936
    server etcd-2 192.168.0.22:80 check port 1936
    server etcd-3 192.168.0.23:80 check port 1936
    server worker-1 192.168.0.31:80 check port 1936
    server worker-2 192.168.0.32:80 check port 1936
    server worker-3 192.168.0.33:80 check port 1936
#    server worker-4 192.168.0.34:80 check port 1936

#
frontend ingress-https-lab
    bind 192.168.0.11:443
    default_backend ingress-https-lab
    mode tcp
    option tcplog

# OpenShift 5.0 more compatible config?
backend ingress-https-lab
    balance source
    mode tcp
    option httpchk
    # option ssl-hello-chk
    http-check send meth GET uri / hdr Host console-openshift-console.apps.lab.example.com
    http-check expect status 200
    server etcd-1 192.168.0.21:443 check check-ssl verify none
    server etcd-2 192.168.0.22:443 check check-ssl verify none
    server etcd-3 192.168.0.23:443 check check-ssl verify none
    server worker-1 192.168.0.31:443 check check-ssl verify none
    server worker-2 192.168.0.32:443 check check-ssl verify none
    server worker-3 192.168.0.33:443 check check-ssl verify none
#    server worker-4 192.168.0.34:443 check check-ssl verify none

